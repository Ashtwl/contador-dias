<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hasta que vuelvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #5b4a5e;
    --muted: #9a8a9c;
    --card: rgba(255, 255, 255, 0.72);
    --pink: #f4a7bb;
    --pink-soft: #fde4ec;
    --lavender: #c9b6ec;
    --lavender-soft: #efe8fb;
    --peach: #ffcfae;
    --mint: #bfe6d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #fff1f5 0%, #fdf0ff 45%, #fff6ec 100%);
    background-attachment: fixed;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 16px 40px;
    overflow-x: hidden;
    position: relative;
  }

  /* Corazones flotando */
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .hearts span {
    position: absolute; bottom: -40px; opacity: 0;
    animation: float linear infinite;
    color: var(--pink);
  }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .55; }
    90%  { opacity: .4; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .hearts { display: none; } }

  main { position: relative; z-index: 1; width: 100%; max-width: 720px; display: grid; gap: 22px; }

  header { text-align: center; }
  .eyebrow { font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; color: var(--muted); }
  h1 {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1.05;
    margin: 6px 0 8px; color: #e07a9a;
  }
  .route { font-size: 1.05rem; color: var(--muted); }
  .route b { color: var(--text); font-weight: 600; }

  .card {
    background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 24px;
    padding: 26px 22px;
    box-shadow: 0 10px 30px rgba(224, 122, 154, 0.12);
    text-align: center;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 700; }
  .card .sub { margin: 0; color: var(--muted); font-size: .92rem; }

  .units { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
  .unit { border-radius: 18px; padding: 14px 4px 12px; background: var(--bg-unit); }
  .num { font-size: clamp(1.7rem, 7vw, 2.8rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--num); line-height: 1.1; }
  .name { font-size: .78rem; font-weight: 600; color: var(--muted); margin-top: 4px; }

  .future { --bg-unit: var(--pink-soft); --num: #e07a9a; }
  .future .units .num { font-size: clamp(2rem, 8.5vw, 3.4rem); }
  .past   { --bg-unit: var(--lavender-soft); --num: #9b84d2; }

  /* Barra de progreso del viaje */
  .progress { margin-top: 6px; }
  .track {
    position: relative; height: 14px; border-radius: 999px;
    background: #f3e9ef; margin: 22px 8px 10px; overflow: visible;
  }
  .fill {
    height: 100%; border-radius: 999px; width: 0%;
    background: linear-gradient(90deg, var(--lavender), var(--pink), var(--peach));
    transition: width .6s ease;
  }
  .plane {
    position: absolute; top: 50%; left: 0%;
    transform: translate(-50%, -55%);
    font-size: 1.5rem; transition: left .6s ease;
  }
  .ends { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); font-weight: 600; padding: 0 2px; }
  .percent { margin-top: 10px; font-weight: 700; color: #e07a9a; }

  .done { display: none; font-family: "Dancing Script", cursive; font-size: 2.2rem; color: #e07a9a; margin-top: 12px; }

  /* Panel de configuración */
  .config { text-align: center; }
  .toggle {
    font: inherit; font-weight: 600; font-size: .95rem; color: var(--text);
    background: rgba(255,255,255,.8); border: 1px solid #f1d6e0;
    border-radius: 999px; padding: 10px 20px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(224,122,154,.12);
  }
  .toggle:hover { background: #fff; }
  .panel { display: none; margin-top: 14px; text-align: left; }
  .panel.open { display: block; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-weight: 600; font-size: .92rem; }
  .field input {
    font: inherit; color: var(--text); background: #fff;
    border: 1px solid #f1d6e0; border-radius: 14px; padding: 10px 12px; width: 100%;
  }
  .field input:focus { outline: 2px solid var(--pink); outline-offset: 1px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    font: inherit; font-weight: 600; border: none; border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
  }
  .btn.primary { background: var(--pink); color: #fff; }
  .btn.ghost { background: var(--lavender-soft); color: var(--text); }
  .lock { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .92rem; cursor: pointer; margin-bottom: 6px; }
  .lock input { width: 18px; height: 18px; accent-color: #e07a9a; }
  .toggle.locked { background: var(--pink-soft); border-color: var(--pink); }
  .hint { font-size: .82rem; color: var(--muted); margin: 0 0 12px; }
  .error { color: #d0567a; font-size: .88rem; font-weight: 600; min-height: 1.2em; margin: 0 0 8px; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 6px; }

  @media (max-width: 420px) {
    .units { gap: 6px; }
    .unit { border-radius: 14px; padding: 12px 2px 10px; }
    .card { padding: 22px 14px; }
  }
</style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main>
    <header>
      <div class="eyebrow">Cuenta regresiva</div>
      <h1 id="titulo">Hasta que vuelvas</h1>
      <div class="route">🏡 <b>Casa</b> &nbsp;·&nbsp; ✈️ &nbsp;·&nbsp; <b>España</b> 💃</div>
    </header>

    <section class="card future">
      <h2>Faltan para que regreses 💕</h2>
      <p class="sub" id="fechaRegreso"></p>
      <div class="units" id="futureUnits"></div>
      <div class="done" id="done">¡Ya estás en casa! 💖</div>
    </section>

    <section class="card progress">
      <h2>Tu intercambio</h2>
      <div class="track">
        <div class="fill" id="fill"></div>
        <div class="plane" id="plane">✈️</div>
      </div>
      <div class="ends"><span>Te fuiste</span><span>Regresas</span></div>
      <div class="percent" id="percent"></div>
    </section>

    <section class="card past">
      <h2>Desde que te fuiste 🌸</h2>
      <p class="sub" id="fechaSalida"></p>
      <div class="units" id="pastUnits"></div>
    </section>

    <section class="config">
      <button class="toggle" id="toggle" aria-expanded="false" aria-controls="panel">⚙️ Cambiar fechas</button>
      <div class="card panel" id="panel">
        <p class="hint">Se guardan en este navegador. La próxima vez que abras la página seguirán aquí.</p>
        <div class="field">
          <label for="inSalida">🌸 Día y hora en que se fue</label>
          <input type="datetime-local" id="inSalida">
        </div>
        <div class="field">
          <label for="inRegreso">💕 Día y hora en que regresa</label>
          <input type="datetime-local" id="inRegreso">
        </div>
        <label class="lock">
          <input type="checkbox" id="bloquear" checked>
          <span>🔒 Poner candado a estas fechas al guardar</span>
        </label>
        <p class="error" id="error"></p>
        <div class="actions">
          <button class="btn ghost" id="reset">Restablecer</button>
          <button class="btn primary" id="guardar">Guardar 💖</button>
        </div>
      </div>
    </section>

    <footer>Cada segundo que pasa es uno menos 🤍</footer>
  </main>

<script>
  // Fechas por defecto (las que ve quien abre la página por primera vez).
  // Formato: "AAAA-MM-DDTHH:MM" (año-mes-día y hora)
  const SALIDA   = "2026-09-01T00:00";  // día que se fue a España
  const REGRESO  = "2027-06-30T00:00";  // día que regresa

  function leer(clave, defecto) {
    try { return localStorage.getItem("contador_" + clave) || defecto; } catch (e) { return defecto; }
  }
  function escribir(clave, valor) {
    try {
      if (valor === null) localStorage.removeItem("contador_" + clave);
      else localStorage.setItem("contador_" + clave, valor);
    } catch (e) {}
  }

  let salida, regreso;
  const fmt = new Intl.DateTimeFormat("es", {
    day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit"
  });

  function aplicar(salidaTxt, regresoTxt) {
    salida = new Date(salidaTxt).getTime();
    regreso = new Date(regresoTxt).getTime();
    document.getElementById("inSalida").value = salidaTxt;
    document.getElementById("inRegreso").value = regresoTxt;
    document.getElementById("fechaSalida").textContent = fmt.format(salida);
    document.getElementById("fechaRegreso").textContent = fmt.format(regreso);
  }
  aplicar(leer("salida", SALIDA), leer("regreso", REGRESO));

  // Panel de configuración
  const panel = document.getElementById("panel");
  const toggle = document.getElementById("toggle");
  const error = document.getElementById("error");
  let bloqueado = leer("bloqueado", "no") === "si";

  function textoBoton() {
    if (panel.classList.contains("open")) return "✖ Cerrar";
    return bloqueado ? "🔒 Fechas con candado" : "⚙️ Cambiar fechas";
  }
  function actualizarBoton() {
    toggle.textContent = textoBoton();
    toggle.classList.toggle("locked", bloqueado && !panel.classList.contains("open"));
    toggle.title = bloqueado ? "Las fechas están bloqueadas. Haz clic para quitar el candado." : "";
  }
  function abrirCerrar(abrir) {
    panel.classList.toggle("open", abrir);
    toggle.setAttribute("aria-expanded", abrir);
    actualizarBoton();
  }
  actualizarBoton();

  toggle.addEventListener("click", () => {
    const abierto = panel.classList.contains("open");
    if (!abierto && bloqueado) {
      if (!confirm("Las fechas tienen candado 🔒\n¿Quieres quitarlo para cambiarlas?")) return;
      bloqueado = false;
      escribir("bloqueado", null);
    }
    abrirCerrar(!abierto);
  });
  document.getElementById("guardar").addEventListener("click", () => {
    const s = document.getElementById("inSalida").value;
    const r = document.getElementById("inRegreso").value;
    if (!s || !r) { error.textContent = "Elige las dos fechas con su hora."; return; }
    if (new Date(r) <= new Date(s)) { error.textContent = "El regreso tiene que ser después de la salida."; return; }
    error.textContent = "";
    escribir("salida", s); escribir("regreso", r);
    aplicar(s, r); tick();
    bloqueado = document.getElementById("bloquear").checked;
    escribir("bloqueado", bloqueado ? "si" : null);
    abrirCerrar(false);
  });
  document.getElementById("reset").addEventListener("click", () => {
    escribir("salida", null); escribir("regreso", null);
    error.textContent = "";
    aplicar(SALIDA, REGRESO); tick();
  });

  function buildUnits(id) {
    const el = document.getElementById(id);
    el.innerHTML = ["Días", "Horas", "Minutos", "Segundos"]
      .map(n => `<div class="unit"><div class="num">0</div><div class="name">${n}</div></div>`).join("");
    return el.querySelectorAll(".num");
  }
  const futureNums = buildUnits("futureUnits");
  const pastNums = buildUnits("pastUnits");

  function render(nums, ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60]
      .forEach((v, i) => nums[i].textContent = i === 0 ? v.toLocaleString("es") : String(v).padStart(2, "0"));
  }

  function tick() {
    const now = Date.now();
    render(futureNums, regreso - now);
    render(pastNums, now - salida);

    const llego = now >= regreso;
    document.getElementById("done").style.display = llego ? "block" : "none";
    document.getElementById("futureUnits").style.display = llego ? "none" : "grid";

    const pct = Math.min(100, Math.max(0, (now - salida) / (regreso - salida) * 100));
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("plane").style.left = pct + "%";
    document.getElementById("percent").textContent =
      llego ? "¡Viaje completado! 🎉" : pct.toFixed(1) + "% del intercambio ya pasó";
  }
  tick();
  setInterval(tick, 1000);

  // Corazones
  const hearts = document.getElementById("hearts");
  const simbolos = ["♥", "♡", "❀", "✿"];
  for (let i = 0; i < 18; i++) {
    const h = document.createElement("span");
    h.textContent = simbolos[i % simbolos.length];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 12 + Math.random() * 18 + "px";
    h.style.animationDuration = 12 + Math.random() * 14 + "s";
    h.style.animationDelay = -Math.random() * 20 + "s";
    if (i % 3 === 1) h.style.color = "#c9b6ec";
    if (i % 3 === 2) h.style.color = "#ffcfae";
    hearts.appendChild(h);
  }
</script>
</body>
</html>
